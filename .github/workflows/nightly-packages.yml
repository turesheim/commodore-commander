name: Nightly Product Packages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            package-dir: Commodore Commander.app
          - platform: windows
            # windows-latest has moved to a Visual Studio version that the
            # Electron node-gyp used by Theia 1.66 does not recognize yet.
            os: windows-2022
            package-dir: commodore-commander-windows
          - platform: linux
            os: ubuntu-latest
            package-dir: commodore-commander-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify Windows native build toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "ImageOS=$env:ImageOS"
          Write-Host "ImageVersion=$env:ImageVersion"
          if ($env:ImageOS -and $env:ImageOS -ne "win22") {
            throw "Windows package builds must run on windows-2022. The Electron node-gyp used by Theia 1.66 does not recognize the Visual Studio 18 toolchain on newer Windows images."
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          }

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev \
            pkg-config \
            python3

      - name: Install macOS VICE build packages
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew untap aws/tap || true
          brew install autoconf automake dos2unix pkg-config sdl2_image subversion xa

      - name: Prepare @vscode/ripgrep download cache
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: node tools/prepare-vscode-ripgrep-cache.mjs

      - name: Install npm dependencies
        env:
          GYP_MSVS_VERSION: "2022"
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_msvs_version: "2022"
        run: npm ci

      - name: Build Theia Electron app
        env:
          GYP_MSVS_VERSION: "2022"
          NODE_OPTIONS: --max-old-space-size=4096
          THEIA_BUILD_MAX_OLD_SPACE_SIZE_MB: "4096"
          npm_config_msvs_version: "2022"
        run: npm run theia:build

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_BASE64 }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_CODESIGN_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CODESIGN_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${MACOS_CODESIGN_CERTIFICATE_BASE64:-}" ]; then
            echo "No macOS signing certificate configured; nightly package will be ad-hoc signed."
            exit 0
          fi

          if [ -z "${MACOS_CODESIGN_CERTIFICATE_PASSWORD:-}" ]; then
            echo "MACOS_CODESIGN_CERTIFICATE_PASSWORD is required when MACOS_CODESIGN_CERTIFICATE_BASE64 is set." >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/codesign-certificate.p12"
          keychain_path="$RUNNER_TEMP/codesign.keychain-db"
          keychain_password="${MACOS_CODESIGN_KEYCHAIN_PASSWORD:-$(uuidgen)}"

          printf '%s' "$MACOS_CODESIGN_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CODESIGN_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          existing_keychains="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain_path" $existing_keychains

          identity="${MACOS_CODESIGN_IDENTITY:-}"
          if [ -z "$identity" ]; then
            identity="$(
              security find-identity -v -p codesigning "$keychain_path" |
                sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' |
                head -n 1
            )"
          fi
          if [ -z "$identity" ]; then
            identity="$(
              security find-identity -v -p codesigning "$keychain_path" |
                sed -n 's/.*"\([^"]*\)".*/\1/p' |
                head -n 1
            )"
          fi
          if [ -z "$identity" ]; then
            echo "No valid code signing identity found in imported certificate." >&2
            security find-identity -v -p codesigning "$keychain_path"
            exit 1
          fi

          echo "CC_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm -f "$certificate_path"

      - name: Package current platform
        shell: bash
        run: |
          package_dir="dist/nightly/${{ matrix.package-dir }}"
          package_archive="dist/nightly/commodore-commander-nightly-${{ matrix.platform }}-${{ runner.arch }}.tar.gz"
          npm run package:current --workspace @commodore-commander/electron-app -- --output "$package_dir"
          tar -czf "$package_archive" -C "$(dirname "$package_dir")" "$(basename "$package_dir")"
          echo "Packaged $package_archive"

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: commodore-commander-nightly-${{ matrix.platform }}-${{ runner.arch }}
          path: dist/nightly/commodore-commander-nightly-${{ matrix.platform }}-${{ runner.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-nightly:
    name: Publish nightly release
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir dist/nightly-artifacts

      - name: Update nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_notes="$RUNNER_TEMP/nightly-release-notes.md"
          {
            echo "Nightly product packages from the latest successful nightly packaging run."
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Built: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } > "$release_notes"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --title "Commodore Commander Nightly" \
              --notes-file "$release_notes" \
              --prerelease
          else
            gh release create nightly \
              --title "Commodore Commander Nightly" \
              --notes-file "$release_notes" \
              --prerelease
          fi

          while IFS= read -r -d '' asset; do
            gh release upload nightly "$asset#$(basename "$asset")" --clobber
          done < <(find dist/nightly-artifacts -type f -name '*.tar.gz' -print0 | sort -z)
