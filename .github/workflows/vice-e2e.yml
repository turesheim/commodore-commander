name: VICE Debugger E2E

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/vice-e2e.yml"
      - "package.json"
      - "package-lock.json"
      - "applications/electron/**"
      - "packages/debug-adapter/**"
      - "packages/language-support/**"
      - "packages/theia-extension/**"
      - "tools/**"
      - "net.sourceforge.vice.cocoa.macosx.aarch64/vice/VICE.app/Contents/Resources/share/vice/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/vice-e2e.yml"
      - "package.json"
      - "package-lock.json"
      - "applications/electron/**"
      - "packages/debug-adapter/**"
      - "packages/language-support/**"
      - "packages/theia-extension/**"
      - "tools/**"
      - "net.sourceforge.vice.cocoa.macosx.aarch64/vice/VICE.app/Contents/Resources/share/vice/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vice-debugger-e2e:
    name: Real VICE DAP session tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VICE_E2E: "1"
      VICE_EXECUTABLE: /usr/bin/x64sc
      VICE_RESOURCES_PATH: ${{ github.workspace }}/net.sourceforge.vice.cocoa.macosx.aarch64/vice/VICE.app/Contents/Resources
      VICE_ARGS: '["-directory","${{ github.workspace }}/net.sourceforge.vice.cocoa.macosx.aarch64/vice/VICE.app/Contents/Resources/share/vice","-console","+sound"]'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --workspace @commodore-commander/debug-adapter --include-workspace-root=false

      - name: Install VICE
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y dbus-x11 vice xvfb

      - name: Verify VICE runtime
        run: |
          test -d "$VICE_RESOURCES_PATH/share/vice"
          test -f "$VICE_RESOURCES_PATH/share/vice/C64/basic-901226-01.bin"
          test -f "$VICE_RESOURCES_PATH/share/vice/C64/kernal-901227-03.bin"
          test -x "$VICE_EXECUTABLE"
          file "$VICE_EXECUTABLE"

      - name: Run real VICE debugger e2e tests
        run: bash tools/run-vice-e2e-linux.sh

      - name: Upload VICE e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vice-e2e-diagnostics
          path: test-results/vice-e2e/
          if-no-files-found: ignore

  theia-ui-e2e:
    name: Theia debugger UI e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "true"
      VICE_EXECUTABLE: /usr/bin/x64sc
      VICE_RESOURCES_PATH: ${{ github.workspace }}/net.sourceforge.vice.cocoa.macosx.aarch64/vice/VICE.app/Contents/Resources
      VICE_ARGS: '["-directory","${{ github.workspace }}/net.sourceforge.vice.cocoa.macosx.aarch64/vice/VICE.app/Contents/Resources/share/vice","-console","+sound"]'
      THEIA_UI_E2E_VICE_EXECUTABLE: /usr/bin/x64sc
      THEIA_UI_E2E_VICE_RESOURCES_PATH: ${{ github.workspace }}/net.sourceforge.vice.cocoa.macosx.aarch64/vice/VICE.app/Contents/Resources
      THEIA_UI_E2E_VICE_ARGS: '["-directory","${{ github.workspace }}/net.sourceforge.vice.cocoa.macosx.aarch64/vice/VICE.app/Contents/Resources/share/vice","-console","+sound"]'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install VICE and UI runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dbus-x11 \
            libatk-bridge2.0-0 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev \
            libxss1 \
            libxtst6 \
            pkg-config \
            python3 \
            vice \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Build Theia Electron app
        run: npm run theia:build

      - name: Verify VICE runtime
        run: |
          test -d "$VICE_RESOURCES_PATH/share/vice"
          test -f "$VICE_RESOURCES_PATH/share/vice/C64/basic-901226-01.bin"
          test -f "$VICE_RESOURCES_PATH/share/vice/C64/kernal-901227-03.bin"
          test -x "$VICE_EXECUTABLE"
          file "$VICE_EXECUTABLE"

      - name: Run Theia debugger UI e2e tests
        run: bash tools/run-theia-ui-e2e-linux.sh

      - name: Upload Theia UI e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theia-ui-e2e-diagnostics
          path: test-results/theia-ui-e2e/
          if-no-files-found: ignore
